<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTIS - Accesso</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .otis {
            color: #0033a0;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .welcome {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 2rem;
        }
        button {
            background-color: #0033a0;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #002070;
        }
        .user-card {
            background-color: #e8f0fe;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }
        .user-info {
            margin: 10px 0;
            padding: 8px;
            background: white;
            border-radius: 4px;
        }
        .pin-input {
            margin: 15px 0;
        }
        .pin-input input {
            padding: 8px;
            font-size: 18px;
            width: 100px;
            text-align: center;
            border: 2px solid #0033a0;
            border-radius: 4px;
            letter-spacing: 4px;
        }
        .logout-btn {
            background-color: #dc3545;
            margin-top: 15px;
        }
        .logout-btn:hover {
            background-color: #c82333;
        }
        .error {
            color: #dc3545;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            display: none;
        }
        .success {
            color: #28a745;
            background-color: #d4edda;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            display: none;
        }
    </style>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="otis">OTIS</div>
        <div class="welcome">Welcome to OTIS</div>
        
        <!-- Sezione Login -->
        <div id="loginSection">
            <button onclick="loginWithMicrosoft()" id="loginBtn">
                Accedi con account aziendale
            </button>
            <p style="color: #666; font-size: 14px; margin-top: 20px;">
                Utilizza il tuo account @ceampartners.com
            </p>
        </div>
        
        <!-- Sezione Utente -->
        <div id="userSection" style="display: none;">
            <div class="user-card">
                <h3 style="color: #0033a0; margin-top: 0;">✅ Accesso effettuato</h3>
                
                <div class="user-info">
                    <strong>Nome:</strong> <span id="userName"></span>
                </div>
                <div class="user-info">
                    <strong>Email:</strong> <span id="userEmail"></span>
                </div>
                
                <!-- Sezione PIN -->
                <div id="pinSection" class="pin-input">
                    <p><strong>Primo accesso - Imposta PIN 4 cifre:</strong></p>
                    <input type="password" id="pin" maxlength="4" pattern="\d{4}" placeholder="****">
                    <button onclick="salvaPin()" style="background-color: #28a745; margin-top: 10px;">
                        Conferma PIN
                    </button>
                </div>
                
                <div id="message" class="error"></div>
                
                <button onclick="logout()" class="logout-btn">
                    Esci
                </button>
            </div>
        </div>
    </div>

    <script>
    // ===========================================
    // CONFIGURAZIONE - INSERISCI I TUOI DATI QUI
    // ===========================================
    const SUPABASE_URL = 'https://berlfufnmolyrmxeyqfd.supabase.co';  // IL TUO URL
    const SUPABASE_ANON_KEY = 'sb_publishable_a3USDfV7gbuauU2Kd6DuQQ_8PFVElpy';              // LA TUA CHIAVE
    
    // Inizializza Supabase (USA UN NOME DIVERSO!)
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // ===========================================
    // FUNZIONI GLOBALI (attaccate a window)
    // ===========================================
    
    // Login
    window.loginWithMicrosoft = async function() {
        try {
            const loginBtn = document.getElementById('loginBtn');
            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.textContent = 'Reindirizzamento...';
            }
            
            console.log('Avvio login...');
            
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'azure',
                options: {
                    redirectTo: window.location.href,
                    scopes: 'email profile'
                }
            });
            
            if (error) throw error;
            
        } catch (error) {
            console.error('Errore:', error);
            mostraMessaggio('Errore: ' + error.message, 'error');
            
            const loginBtn = document.getElementById('loginBtn');
            if (loginBtn) {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Accedi con account aziendale';
            }
        }
    };
    
    // Logout
    window.logout = async function() {
        try {
            await supabaseClient.auth.signOut();
            window.location.reload();
        } catch (error) {
            console.error('Errore logout:', error);
        }
    };
    
    // Salva PIN
    window.salvaPin = async function() {
        const pin = document.getElementById('pin').value;
        
        if (!pin || !/^\d{4}$/.test(pin)) {
            mostraMessaggio('PIN non valido (4 cifre)', 'error');
            return;
        }
        
        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                mostraMessaggio('Sessione non valida', 'error');
                return;
            }
            
            const user = session.user;
            
            const { error } = await supabaseClient
                .from('utenti')
                .insert([{
                    email: user.email,
                    nome: user.user_metadata?.name || user.email,
                    pin: pin,
                    microsoft_id: user.id
                }]);
            
            if (error) {
                if (error.code === '23505') {
                    mostraMessaggio('Utente già registrato!', 'success');
                    document.getElementById('pinSection').style.display = 'none';
                } else {
                    throw error;
                }
            } else {
                mostraMessaggio('Registrazione completata!', 'success');
                document.getElementById('pinSection').style.display = 'none';
            }
            
        } catch (error) {
            console.error('Errore:', error);
            mostraMessaggio('Errore: ' + error.message, 'error');
        }
    };
    
    // ===========================================
    // FUNZIONI DI SUPPORTO
    // ===========================================
    
    function mostraMessaggio(testo, tipo) {
        const msgDiv = document.getElementById('message');
        msgDiv.textContent = testo;
        msgDiv.className = tipo;
        msgDiv.style.display = 'block';
        
        setTimeout(() => {
            msgDiv.style.display = 'none';
        }, 3000);
    }
    
    async function aggiornaUI() {
        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session) {
                // Utente loggato
                const user = session.user;
                
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('userSection').style.display = 'block';
                document.getElementById('userName').textContent = 
                    user.user_metadata?.name || user.email.split('@')[0];
                document.getElementById('userEmail').textContent = user.email;
                
                // Verifica se esiste già
                const { data: existing } = await supabaseClient
                    .from('utenti')
                    .select('*')
                    .eq('email', user.email)
                    .maybeSingle();
                
                document.getElementById('pinSection').style.display = existing ? 'none' : 'block';
                
            } else {
                // Nessun utente
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('userSection').style.display = 'none';
            }
            
        } catch (error) {
            console.error('Errore aggiornamento UI:', error);
        }
    }
    
    // ===========================================
    // INIZIALIZZAZIONE
    // ===========================================
    
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Pagina caricata');
        aggiornaUI();
        
        // Ascolta cambiamenti auth
        supabaseClient.auth.onAuthStateChange((event, session) => {
            console.log('Evento auth:', event);
            aggiornaUI();
        });
    });
    
    // Debug
    window.debug = {
        getSession: async () => {
            const { data } = await supabaseClient.auth.getSession();
            console.log('Sessione:', data);
        }
    };
    
    </script>
    
    <!-- Debug button -->
    <div style="text-align: center; margin-top: 20px;">
        <button onclick="debug.getSession()" style="background-color: #666; width: auto; padding: 5px 10px;">
            Debug Sessione
        </button>
    </div>
</body>
</html>
