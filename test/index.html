<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTIS - Accesso</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        .otis { color: #0033a0; font-size: 2rem; font-weight: bold; }
        button {
            background-color: #0033a0;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        .user-card {
            background-color: #e8f0fe;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            display: none;
            text-align: left;
        }
        input {
            padding: 8px;
            font-size: 16px;
            width: 100px;
            text-align: center;
            margin: 10px;
        }
    </style>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="otis">OTIS</div>
        <h2>Welcome to OTIS</h2>
        
        <div id="loginSection">
            <button onclick="loginWithMicrosoft()">
                Accedi con account aziendale
            </button>
            <p style="color: #666;">@ceampartners.com</p>
        </div>
        
        <div id="userSection" style="display: none;">
            <div class="user-card">
                <h3>✅ Accesso effettuato</h3>
                <p><strong>Nome:</strong> <span id="userName"></span></p>
                <p><strong>Email:</strong> <span id="userEmail"></span></p>
                
                <!-- PIN 4 cifre (solo primo accesso) -->
                <div id="pinSection">
                    <p><strong>Inserisci PIN 4 cifre:</strong></p>
                    <input type="password" id="pin" maxlength="4" pattern="\d{4}">
                    <button onclick="salvaPin()" style="background-color: #28a745;">
                        Conferma PIN
                    </button>
                </div>
                
                <button onclick="logout()" style="background-color: #dc3545;">
                    Esci
                </button>
            </div>
        </div>
    </div>

    <script>
    // CONFIGURAZIONE SUPABASE (usa le tue credenziali)
    const SUPABASE_URL = 'https://tuo-progetto.supabase.co';
    const SUPABASE_ANON_KEY = 'la-tua-anon-key';
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // LOGIN CON MICROSOFT
    async function loginWithMicrosoft() {
        try {
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'azure',
                options: {
                    redirectTo: window.location.href, // Torna a questa stessa pagina
                    scopes: 'email profile'
                }
            });
            
            if (error) throw error;
            
        } catch (error) {
            console.error('Errore:', error);
            alert('Errore durante il login: ' + error.message);
        }
    }

    // GESTIONE RITORNO DA MICROSOFT
    window.addEventListener('load', async function() {
        // Verifica se c'è una sessione attiva
        const { data: { session } } = await supabase.auth.getSession();
        
        if (session) {
            // Utente loggato con Microsoft
            const user = session.user;
            const userEmail = user.email;
            const userName = user.user_metadata?.name || user.email?.split('@')[0];
            
            // Mostra dati utente
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('userSection').style.display = 'block';
            document.getElementById('userName').textContent = userName;
            document.getElementById('userEmail').textContent = userEmail;
            
            // Verifica se l'utente esiste già nel tuo database
            const { data: existingUser } = await supabase
                .from('utenti')
                .select('*')
                .eq('email', userEmail)
                .single();
            
            if (!existingUser) {
                // Primo accesso: mostra campo PIN
                document.getElementById('pinSection').style.display = 'block';
            } else {
                // Utente già registrato: nascondi PIN
                document.getElementById('pinSection').style.display = 'none';
                // Qui puoi reindirizzare alla dashboard
                // window.location.href = '/dashboard.html';
            }
        }
    });

    // SALVA PIN (primo accesso)
    async function salvaPin() {
        const pin = document.getElementById('pin').value;
        
        if (!/^\d{4}$/.test(pin)) {
            alert('Inserisci un PIN di 4 cifre');
            return;
        }
        
        const { data: { session } } = await supabase.auth.getSession();
        const user = session.user;
        
        // Salva in Supabase (tabella utenti)
        const { error } = await supabase
            .from('utenti')
            .insert([
                {
                    email: user.email,
                    nome: user.user_metadata?.name,
                    pin: pin, // IN PRODUZIONE: fai l'hash del PIN!
                    microsoft_id: user.id
                }
            ]);
        
        if (error) {
            alert('Errore nel salvataggio: ' + error.message);
        } else {
            alert('Registrazione completata!');
            document.getElementById('pinSection').style.display = 'none';
        }
    }

    // LOGOUT
    async function logout() {
        await supabase.auth.signOut();
        window.location.reload();
    }
    </script>
</body>
</html>
