<!DOCTYPE html>
<html>
<head>
    <title>Test Login Microsoft</title>
</head>
<body>
    <h1>Test Autenticazione Microsoft</h1>
    <button onclick="window.location.href='index.html'">Vai al Login</button>
    
    <div id="risultati">
        <h3>Dati salvati in sessione:</h3>
        <p>Nome: <span id="displayName"></span></p>
        <p>Email: <span id="displayEmail"></span></p>
    </div>
    
    <script>
        document.getElementById('displayName').textContent = 
            sessionStorage.getItem('userName') || 'Nessun dato';
        document.getElementById('displayEmail').textContent = 
            sessionStorage.getItem('userEmail') || 'Nessun dato';
    </script>
</body>
</html>
